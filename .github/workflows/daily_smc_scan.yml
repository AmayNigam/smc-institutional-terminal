name: Enterprise SMC Data Pipeline

on:
  schedule:
    - cron: '30 11 * * 1-5' # Runs Mon-Fri after market close
  workflow_dispatch:

jobs:
  build_and_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Multi-Threaded Engine
      run: python backend_scanner.py

    - name: Commit Updated CSVs
      run: |
        git config --global user.name 'SMC Bot'
        git config --global user.email 'bot@alphaflow.com'
        git add SMC_ACTIONABLE_ALERTS.csv SMC_MASTER_RADAR_FEED.csv || echo "No files to add"
        git commit -m "Automated Market Scan Data Update" || echo "No changes to commit"
        git push
