name: Daily Institutional SMC Scanner

on:
  schedule:
    # Runs at 10:15 AM UTC every weekday (Monday-Friday). 
    # This corresponds to 3:45 PM IST (just after the Indian market closes)
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # This adds a button allowing you to run it manually anytime

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Daily SMC Scanner & Telegram Dispatch
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python daily_cron.py

    - name: Commit and Push Updated CSV Feeds
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add SMC_ACTIONABLE_ALERTS.csv SMC_MASTER_RADAR_FEED.csv
        # Only commit if there are new setups to update the dashboard
        git diff-index --quiet HEAD || (git commit -m "Automated Market Close Update: SMC Feeds" && git push)
