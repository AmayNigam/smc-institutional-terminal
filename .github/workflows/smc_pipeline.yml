name: Enterprise SMC Data Pipeline

on:
  schedule:
    # Runs at 11:30 UTC (5:00 PM IST) Monday through Friday
    - cron: '30 11 * * 1-5' 
  workflow_dispatch:
  
jobs:
  build_and_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
   steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Execute Multi-Threaded Engine
        run: python backend_scanner.py
        
      - name: Commit and Push CSV Updates
        run: |
          git config --global user.name "AlphaFlow-Bot"
          git config --global user.email "bot@alphaflow.com"
          git add SMC_MASTER_RADAR_FEED.csv SMC_ACTIONABLE_ALERTS.csv
          git commit -m "Auto-update EOD Market Data" || exit 0
          git push
